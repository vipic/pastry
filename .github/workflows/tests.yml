name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift-test:
    name: Swift Tests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Swift Version
        run: swift --version

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Check
        run: mise run check
